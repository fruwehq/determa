name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  family-connection-v1-vectors:
    name: family connection v1 vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r scripts/requirements-family-connection-v1-vectors.txt
      - run: python3 scripts/validate-family-connection-v1-vectors.py

  python:
    name: python launcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  rust:
    name: rust launcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: MSRV metadata
        run: python3 ../scripts/check-rust-msrv.py .
      - name: Build
        run: cargo build --release --locked
      - name: Clippy
        run: cargo clippy --release --all-targets --all-features --locked -- -D warnings
      - name: Default tests
        run: cargo test --locked
      - name: Repository fixture tests
        run: cargo run --locked --example family-connection-context-v1-vectors --features repository-fixtures
      - name: Packaged all-features tests
        run: |
          cargo package --locked
          mkdir -p target/package-test
          tar -xzf target/package/determa-*.crate -C target/package-test
          cargo test --locked --all-features --manifest-path target/package-test/determa-*/Cargo.toml

  rust-msrv:
    name: rust launcher MSRV
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.81.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv-1.81
      - name: MSRV metadata
        run: python3 ../scripts/check-rust-msrv.py .
      - name: Build
        run: cargo build --release --locked
      - name: Default tests
        run: cargo test --locked
      - name: Repository fixture tests
        run: cargo run --locked --example family-connection-context-v1-vectors --features repository-fixtures

  node:
    name: node launcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Tests
        run: npm test
