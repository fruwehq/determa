[package]
name = "determa"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
authors = ["fruwehq"]
license = "MIT"
description = "Umbrella launcher for the Determa family — git-style dispatch to determa-<product> commands"
repository = "https://github.com/fruwehq/determa"
readme = "README.md"
keywords = ["determa", "cli", "launcher", "statechart", "dispatcher"]
categories = ["command-line-utilities"]

[[bin]]
name = "determa"
path = "src/main.rs"

[[example]]
name = "family-connection-context-v1-vectors"
path = "examples/family_connection_context_v1_vectors.rs"
required-features = ["repository-fixtures"]

[features]
repository-fixtures = []

[dependencies]
icu_normalizer = "=1.5.0"
icu_normalizer_data = "=1.5.1"
icu_properties = "=1.5.1"
icu_properties_data = "=1.5.1"
idna = "=1.1.0"
idna_adapter = "=1.2.0"
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
